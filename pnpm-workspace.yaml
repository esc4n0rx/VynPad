packages:
  - apps/desktop
  - apps/web
  - protocol
  - e2e
allowBuilds:
  # Os hooks são instalados pelo script `prepare` da raiz.
  lefthook: false
  # O E2E usa o tauri-driver e o msedgedriver próprios (e2e/scripts); o WebdriverIO não precisa baixar
  # nem compilar os drivers dele.
  edgedriver: false
  geckodriver: false
  esbuild: false
minimumReleaseAgeExclude:
  - '@next/env@16.4.0'
  - '@next/eslint-plugin-next@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - next@16.4.0
