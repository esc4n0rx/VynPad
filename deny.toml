# Política de dependências (https://embarkstudios.github.io/cargo-deny/).

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
ignore = [
  # Não mantido, mas só chega pelo gtk3-macros (dependência do Tauri no Linux), sem impacto de segurança conhecido.
  { id = "RUSTSEC-2024-0370", reason = "transitivo via gtk-rs do Tauri; sem correção upstream" },
]

[licenses]
confidence-threshold = 0.9
# A lista cobre também licenças comuns de dependências futuras.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
]

[licenses.private]
# Os crates do workspace têm `publish = false` e ainda não declaram licença (decisão pendente).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
