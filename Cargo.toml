[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Crates internos
padgaming-protocol = { path = "crates/padgaming-protocol" }
padgaming-driver = { path = "crates/padgaming-driver" }
padgaming-mapping = { path = "crates/padgaming-mapping" }
padgaming-net = { path = "crates/padgaming-net" }
padgaming-storage = { path = "crates/padgaming-storage" }
padgaming-core = { path = "crates/padgaming-core" }
padgaming-server = { path = "crates/padgaming-server" }

# Externos (versões centralizadas)
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"

[workspace.lints.rust]
# O padgaming-driver libera pontualmente com #[allow(unsafe_code)] no módulo de FFI.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Hot path mais realista em builds de debug.
[profile.dev.package.padgaming-protocol]
opt-level = 1

[profile.dev.package.padgaming-mapping]
opt-level = 1
