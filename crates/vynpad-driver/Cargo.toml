[package]
name = "vynpad-driver"
description = "Trait VirtualPadDriver e backends de emulação do X360 (ViGEmBus no Windows, uinput no Linux)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `MockDriver`, para testar o resto do server sem driver instalado.
mock = []

[dependencies]
crossbeam-channel = "0.5"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Liga o mock também ao testar só esta crate (os testes de integração precisam dele).
vynpad-driver = { path = ".", features = ["mock"] }
tempfile = "3"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
rusty-xinput = "1.3.0"
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows-service = "0.8.1"
winreg = "0.56.0"
