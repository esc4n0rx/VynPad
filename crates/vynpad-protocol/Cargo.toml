[package]
name = "vynpad-protocol"
description = "Formatos de pacote, (de)serialização e criptografia do protocolo VynPad."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Canal de controle (JSON) e serde. O núcleo UDP é no_std e não aloca.
std = ["dep:serde", "dep:serde_json", "dep:base64"]

[dependencies]
bitflags = "2"
chacha20poly1305 = { version = "0.11", default-features = false }
base64 = { version = "0.22", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
hex = "0.4"
serde_json = { workspace = true }

[[bench]]
name = "udp"
harness = false

[lints]
workspace = true
