[package]
name = "vynpad-client-core"
description = "Núcleo do client VynPad (sessão, protocolo, pareamento) exposto ao Kotlin e ao Swift via UniFFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# `cdylib`: a biblioteca nativa que o app carrega; `lib`: testes e reuso em Rust.
crate-type = ["lib", "cdylib"]

[features]
# Gerador de bindings (`cargo run --features bindgen --bin uniffi-bindgen`). Fica fora do
# build padrão para não puxar a CLI do UniFFI em quem só compila o workspace.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
vynpad-protocol = { workspace = true }
thiserror = { workspace = true }
uniffi = "0.32"
# Só TLS 1.3, com o provedor `ring` (igual ao server).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
hex = "0.4"
serde_json = { workspace = true }
# O handshake é testado contra o server de controle de verdade (loopback + driver de mentira).
tokio = { workspace = true }
vynpad-core = { workspace = true }
vynpad-driver = { workspace = true, features = ["mock"] }
vynpad-net = { workspace = true }

[lints]
workspace = true
