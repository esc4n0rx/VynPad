[package]
name = "vynpad-dbprep"
description = "Ferramenta de desenvolvimento: cria um banco só com o schema para gerar os metadados do sqlx (.sqlx/)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Fica fora do `vynpad-storage` de propósito: para gerar os metadados é preciso compilar o
# storage contra um banco que já exista, e esse banco não pode depender de compilar o storage.
[dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { workspace = true }

[lints]
workspace = true
