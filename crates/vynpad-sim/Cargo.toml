[package]
name = "vynpad-sim"
description = "Client simulador em CLI para testar o server sem o app Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `connect --gamepad`: repassa um controle físico local (via `gilrs`). Fica fora do build
# padrão porque, no Linux, o `gilrs` exige libudev.
gamepad = ["dep:gilrs"]

[dependencies]
vynpad-protocol = { workspace = true }
anyhow = { workspace = true }
if-addrs = "0.15"
mdns-sd = "0.21"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
gilrs = { version = "0.11", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Só TLS 1.3, com o provedor `ring` (igual ao server).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = { version = "0.11", default-features = false }
toml = "1"

[target.'cfg(windows)'.dependencies]
# `timeBeginPeriod`: relógio de 1 ms para o pacing do client (ver `client.rs`).
windows-sys = { version = "0.61.2", features = ["Win32_Media"] }

[dev-dependencies]
vynpad-core = { workspace = true }
vynpad-driver = { workspace = true, features = ["mock"] }
vynpad-mapping = { workspace = true }
vynpad-net = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
