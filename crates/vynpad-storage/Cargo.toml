[package]
name = "vynpad-storage"
description = "Persistência em SQLite: migrations e repositórios."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `specta::Type` nas configurações, para o app gerar os tipos TypeScript (T-506).
specta = ["dep:specta"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
vynpad-mapping = { workspace = true }
dirs = { workspace = true }
# `sqlite` traz o SQLite embutido (bundled); sem TLS, pois o banco é local.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
