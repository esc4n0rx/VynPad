[package]
name = "vynpad-mapping"
description = "Pipeline puro de mapeamento: deadzones, curvas, gyro e remapeamento de botões."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `specta::Type` nos tipos do perfil, para o app gerar os tipos TypeScript (T-506).
specta = ["dep:specta"]

[dependencies]
vynpad-driver = { workspace = true }
vynpad-protocol = { workspace = true }
arc-swap = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
proptest = "1"

[[bench]]
name = "apply"
harness = false

[lints]
workspace = true
