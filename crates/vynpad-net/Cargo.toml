[package]
name = "vynpad-net"
description = "Rede do server: loop UDP de input, canal de controle TLS e descoberta mDNS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vynpad-core = { workspace = true }
vynpad-driver = { workspace = true }
vynpad-mapping = { workspace = true }
vynpad-protocol = { workspace = true }
arc-swap = "1"
base64 = "0.23"
crossbeam-channel = "0.5"
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Provedor `ring` (o aws-lc-rs exigiria cmake/nasm no build do Windows).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Sem a feature `tls12`: o servidor fala só TLS 1.3.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = { workspace = true }
uuid = { version = "1", default-features = false }
socket2 = "0.6"
mdns-sd = "0.21.4"
if-addrs = "0.15.0"

[dev-dependencies]
vynpad-driver = { workspace = true, features = ["mock"] }
serde_json = { workspace = true }
tempfile = "3"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }
# COM do firewall (INetFwPolicy2) e elevação por UAC (ShellExecuteExW).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
