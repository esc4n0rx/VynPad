name: Release

# Uma tag `v*` gera o instalador do Windows, assina e publica no GitHub Release (T-703).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Instalador do Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: A tag bate com a versão do app
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $version do tauri.conf.json" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Assinatura de código com o Azure Trusted Signing (executável e instalador). Sem os
      # segredos configurados o build sai sem assinar, e o SmartScreen vai alertar.
      - name: Configura a assinatura
        id: signing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$SIGNING_ACCOUNT" ]; then
            echo "::warning::Segredos de assinatura ausentes: o instalador será publicado SEM assinatura."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo '{}' > signing.json
            exit 0
          fi
          cargo install trusted-signing-cli --locked
          node -e '
            const cmd = `trusted-signing-cli -e ${process.env.SIGNING_ENDPOINT} -a ${process.env.SIGNING_ACCOUNT} -c ${process.env.SIGNING_PROFILE} -d PadGaming %1`;
            require("fs").writeFileSync("signing.json", JSON.stringify({ bundle: { windows: { signCommand: cmd } } }));
          '
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # NSIS (por usuário, sem admin) e MSI para empresas.
      - run: pnpm --filter @padgaming/desktop tauri build --bundles nsis,msi --config "${{ github.workspace }}/signing.json"

      - name: Confere a assinatura
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem target/release/bundle -Recurse -Include *.exe, *.msi |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { $bad.FullName; throw "Arquivos sem assinatura válida" }

      - name: Publica o release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O changelog sai dos commits e PRs desde a tag anterior.
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "PadGaming $GITHUB_REF_NAME" \
            target/release/bundle/nsis/*.exe \
            target/release/bundle/msi/*.msi
