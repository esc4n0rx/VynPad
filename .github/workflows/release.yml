name: Release

# Uma tag `v*` gera o instalador do Windows, assina e publica no GitHub Release (T-703).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Instalador do Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O changelog sai dos commits desde a tag anterior: precisa do histórico e das tags.
          fetch-depth: 0
      - name: A tag bate com a versão do app
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $version do tauri.conf.json" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Atualizações (T-704): o `latest.json` e o `.sig` do instalador são assinados com a chave
      # minisign do updater. Sem ela o app não aceitaria a atualização, então o release falha.
      - name: A chave do updater existe
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Configure o segredo TAURI_SIGNING_PRIVATE_KEY (e TAURI_SIGNING_PRIVATE_KEY_PASSWORD, se a chave tiver senha)." >&2
            exit 1
          fi

      # Assinatura de código com o Azure Trusted Signing (executável e instalador). Sem os
      # segredos configurados o build sai sem assinar, e o SmartScreen vai alertar.
      - name: Configura a assinatura
        id: signing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$SIGNING_ACCOUNT" ]; then
            echo "::warning::Segredos de assinatura ausentes: o instalador será publicado SEM assinatura."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > signing.json
            exit 0
          fi
          cargo install trusted-signing-cli --locked
          node -e '
            const cmd = `trusted-signing-cli -e ${process.env.SIGNING_ENDPOINT} -a ${process.env.SIGNING_ACCOUNT} -c ${process.env.SIGNING_PROFILE} -d VynPad %1`;
            require("fs").writeFileSync("signing.json", JSON.stringify({ bundle: { createUpdaterArtifacts: true, windows: { signCommand: cmd } } }));
          '
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # NSIS (por usuário, sem admin) e MSI para empresas, mais o `.sig` do updater.
      - run: pnpm --filter @vynpad/desktop tauri build --bundles nsis,msi --config "${{ github.workspace }}/signing.json"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Confere a assinatura
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem target/release/bundle -Recurse -Include *.exe, *.msi |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { $bad.FullName; throw "Arquivos sem assinatura válida" }

      - name: Publica o release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O changelog sai dos Conventional Commits desde a tag anterior (scripts/changelog.mjs); as
          # mesmas notas vão no `latest.json`, que o app mostra em Configurações → Sobre.
          node scripts/changelog.mjs --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --out notes.md
          node scripts/make-latest-json.mjs --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir target/release/bundle/nsis --notes-file notes.md --out latest.json
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md --title "VynPad $GITHUB_REF_NAME" \
            target/release/bundle/nsis/*.exe \
            target/release/bundle/nsis/*.exe.sig \
            target/release/bundle/msi/*.msi \
            latest.json
