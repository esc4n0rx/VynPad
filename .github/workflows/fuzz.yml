name: Fuzz

# O cargo-fuzz (libFuzzer) não linka no Windows/MSVC sem a runtime do ASan do Visual Studio,
# então o fuzzing roda aqui, no Linux. Localmente: `cargo +nightly fuzz run <alvo>` em
# crates/vynpad-protocol/fuzz (Linux/WSL).

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Tempo de fuzzing por alvo, em segundos
        default: "600"
  schedule:
    # Segunda-feira, 06:00 UTC.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [udp_decode, udp_roundtrip, control_frame]
    defaults:
      run:
        working-directory: crates/vynpad-protocol/fuzz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/vynpad-protocol/fuzz
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ inputs.seconds || '600' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/vynpad-protocol/fuzz/artifacts
          retention-days: 30
