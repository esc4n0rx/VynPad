name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      # Só documentação e metadados do repositório: não há o que testar.
      - "**/*.md"
      - "**/*.txt"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore: *docs-only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O CI só lê o repositório; nenhum job precisa de mais que isso.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Checagens rápidas e independentes de SO.
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Hooks, stores e a ligação com os eventos do backend (bindings dublados).
      - run: pnpm test
      # Test vectors em dia com o gerador, válidos nos schemas e coerentes com a referência.
      - run: pnpm --filter @vynpad/protocol check

  deps:
    name: Dependências (cargo-deny, cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: bnjbvr/cargo-machete@main

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O generate_context! do Tauri exige o frontend compilado em apps/desktop/dist.
      - run: pnpm --filter @vynpad/desktop build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # O desktop roda separado: no Windows, o tauri-build põe um msvcrt.lib vazio (CRT
      # estática) no caminho de busca do linker, e o cargo o repassa aos doctests das outras
      # crates da mesma invocação, que então ficam sem CRT (LNK1120).
      - run: cargo test --workspace --exclude vynpad-desktop --locked --no-fail-fast
      - run: cargo test -p vynpad-desktop --locked --no-fail-fast

  coverage:
    if: github.actor != 'dependabot[bot]'
    name: Cobertura (cargo-llvm-cov)
    needs: [rust]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # O desktop fica de fora: a webview não roda aqui e a UI tem Vitest e o E2E.
      - run: cargo llvm-cov --workspace --exclude vynpad-desktop --locked --json --summary-only --output-path cov.json
      # Mínimo de 80% de linhas nos crates de domínio; a tabela vai para o resumo do job.
      - run: node scripts/coverage-gate.mjs cov.json
      - run: cargo llvm-cov report --html --output-dir coverage-html
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            cov.json
            coverage-html
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    if: github.actor != 'dependabot[bot]'
    name: E2E da interface (Windows)
    # PENDENTE: no runner o WebView2 153 ignora a porta de depuração do msedgedriver (passa no PC
    # com o WebView2 154). Enquanto isso o job informa mas não derruba o CI; ver
    # docs/tasks/F7-release-windows/T-701-testes.md (Pendências) e o workflow e2e-debug.
    continue-on-error: true
    needs: [rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O app precisa do frontend embutido (custom-protocol); sem isso ele tentaria o servidor do Vite.
      - run: pnpm --filter @vynpad/desktop build
      - run: cargo build --release --locked -p vynpad-desktop --features tauri/custom-protocol
      # O simulador faz o papel do celular nos testes de pareamento.
      - run: cargo build --locked -p vynpad-sim
      - run: cargo install tauri-driver --locked
      # O msedgedriver precisa ter a versão do WebView2 do runner.
      - run: pnpm --filter @vynpad/e2e drivers
      # Diagnóstico: abre o app sozinho por alguns segundos, com a saída visível, para o caso de o
      # WebDriver não conseguir abrir a sessão.
      - name: O app abre sozinho no runner
        shell: pwsh
        continue-on-error: true
        env:
          VYNPAD_E2E: "1"
        run: |
          $env:VYNPAD_DATA_DIR = Join-Path $env:RUNNER_TEMP "vynpad-smoke"
          $p = Start-Process target/release/vynpad-desktop.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { "O app saiu sozinho com código $($p.ExitCode)" } else { "O app segue aberto (PID $($p.Id))"; Stop-Process -Id $p.Id -Force }
          Get-ChildItem "$env:LOCALAPPDATA\VynPad\logs" -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 25 }
      - run: pnpm --filter @vynpad/e2e e2e
        env:
          E2E_DRIVER_LOG: ${{ github.workspace }}\e2e\logs\msedgedriver.log
      # O upload-artifact só aceita caminhos dentro do workspace: traz os logs do app para cá.
      - name: Junta os logs do app
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e/logs/app | Out-Null
          Copy-Item "$env:LOCALAPPDATA\VynPad\logs\*" e2e/logs/app -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostico
          path: e2e/logs
          if-no-files-found: ignore
          retention-days: 7

  bench:
    if: github.actor != 'dependabot[bot]'
    name: Benchmark do server (gate de regressão)
    needs: [rust]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # O dev_server só existe em debug; com --mock não toca no sistema.
      # Dois comandos: o `--example` valeria para os dois pacotes e o simulador não seria compilado.
      - run: cargo build --locked -p vynpad-net --example dev_server
      - run: cargo build --locked -p vynpad-sim
      - name: Bench de 20 s com 4 clients a 250 Hz
        run: |
          target/debug/examples/dev_server --mock > dev_server.log 2>&1 &
          sleep 2
          target/debug/vynpad-sim bench --insecure-dev --clients 4 --rate 250 --duration 20s --json bench.json
      - run: node scripts/bench-gate.mjs bench.json docs/benchmarks/baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore
          retention-days: 14

  # Client Android: ktlint, lint do Android, testes de lógica e o build de release (R8) e do
  # App Bundle, com os mesmos comandos que se rodam em apps/android (T-910).
  android:
    name: Android (ktlint, lint, testes, release)
    runs-on: ubuntu-latest
    env:
      KTLINT_VERSION: "1.8.0"
      KTLINT_SHA256: "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75"
      NDK_VERSION: "27.1.12297006"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # O cache do Gradle só é gravado na main; PRs apenas leem.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: SDK e NDK do Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" "ndk;$NDK_VERSION"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: ktlint (binário fixado por versão e hash)
        run: |
          curl -sSL -o "$RUNNER_TEMP/ktlint" "https://github.com/ktlint/ktlint/releases/download/$KTLINT_VERSION/ktlint"
          echo "$KTLINT_SHA256  $RUNNER_TEMP/ktlint" | sha256sum --check
          chmod +x "$RUNNER_TEMP/ktlint"
          cd apps/android
          "$RUNNER_TEMP/ktlint" "shared/src/**/*.kt" "androidApp/src/**/*.kt" "*.kts" "shared/*.kts" "androidApp/*.kts" "buildSrc/**/*.kt"
      - name: Testes, lint e release
        working-directory: apps/android
        run: ./gradlew :shared:testAndroid :androidApp:lintRelease :androidApp:assembleRelease :androidApp:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          path: |
            apps/android/androidApp/build/outputs/apk/release/*.apk
            apps/android/androidApp/build/outputs/bundle/release/*.aab
          retention-days: 7

  # Site oficial (apps/web): lint, tipos e testes já rodam no job `lint`; aqui vai o build de
  # produção, que também confere o CSP, o sitemap e as páginas estáticas.
  web:
    name: Site (build)
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://vynpad.example
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vynpad/web build

  bundle:
    name: Build do app (${{ matrix.os }})
    needs: [lint, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sem assinatura: a assinatura e a publicação ficam no release.yml (T-703).
      - run: pnpm --filter @vynpad/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
          retention-days: 7
