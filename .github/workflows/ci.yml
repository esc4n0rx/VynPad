name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Checagens rápidas e independentes de SO.
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Hooks, stores e a ligação com os eventos do backend (bindings dublados).
      - run: pnpm test
      # Test vectors em dia com o gerador, válidos nos schemas e coerentes com a referência.
      - run: pnpm --filter @padgaming/protocol check

  deps:
    name: Dependências (cargo-deny, cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: bnjbvr/cargo-machete@main

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O generate_context! do Tauri exige o frontend compilado em apps/desktop/dist.
      - run: pnpm --filter @padgaming/desktop build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # O desktop roda separado: no Windows, o tauri-build põe um msvcrt.lib vazio (CRT
      # estática) no caminho de busca do linker, e o cargo o repassa aos doctests das outras
      # crates da mesma invocação, que então ficam sem CRT (LNK1120).
      - run: cargo test --workspace --exclude padgaming-desktop --locked
      - run: cargo test -p padgaming-desktop --locked

  bench:
    name: Benchmark do server (gate de regressão)
    needs: [rust]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # O dev_server só existe em debug; com --mock não toca no sistema.
      - run: cargo build --locked -p padgaming-net --example dev_server -p padgaming-sim
      - name: Bench de 20 s com 4 clients a 250 Hz
        run: |
          target/debug/examples/dev_server --mock > dev_server.log 2>&1 &
          sleep 2
          target/debug/padgaming-sim bench --insecure-dev --clients 4 --rate 250 --duration 20s --json bench.json
      - run: node scripts/bench-gate.mjs bench.json docs/benchmarks/baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore
          retention-days: 14

  bundle:
    name: Build do app (${{ matrix.os }})
    needs: [lint, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sem assinatura: a assinatura e a publicação ficam no release.yml (T-703).
      - run: pnpm --filter @padgaming/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
          retention-days: 7
