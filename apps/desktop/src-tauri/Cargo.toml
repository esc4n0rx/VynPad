[package]
name = "vynpad-desktop"
description = "Server desktop do VynPad (shell Tauri)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# O sufixo `_lib` evita conflito de nome entre lib e bin no Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "vynpad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs.workspace = true
vynpad-core.workspace = true
vynpad-driver.workspace = true
vynpad-mapping = { workspace = true, features = ["specta"] }
vynpad-net.workspace = true
vynpad-protocol.workspace = true
vynpad-server.workspace = true
vynpad-storage = { workspace = true, features = ["specta"] }
serde.workspace = true
serde_json.workspace = true
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
vynpad-driver = { workspace = true, features = ["mock"] }
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
winreg = "0.56.0"
